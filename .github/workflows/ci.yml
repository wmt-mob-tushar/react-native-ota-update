name: CI

# Type-checks and builds the workspaces on every push / PR so broken
# changes are caught automatically.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build SDK (typecheck)
        run: npx tsc --noEmit
        working-directory: packages/sdk

      - name: Build CLI
        run: npm run build
        working-directory: packages/cli

      - name: Build dashboard
        run: npm run build
        working-directory: apps/dashboard
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://iboujbxhilhhehcrsorv.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AwualE5kkqlHc0yx_v2rgQ_dJHTGFqW
